[project]
name = "voice-to-anylist"
version = "0.1.0"
description = "Two-way bridge between a Google Keep shopping list and AnyList"
requires-python = ">=3.11"
dependencies = [
    "gkeepapi>=0.16.0",
    "gpsoauth>=1.1.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "inflect>=7.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
voice-to-anylist = "voice_to_anylist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
