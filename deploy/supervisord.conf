; Both processes are essential: if either dies for good the container should be
; replaced rather than limp along half-connected.
[supervisord]
nodaemon=true
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:anylist-api]
command=node /app/anylist-api/server.js
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Start first so the bridge's first cycle has something to talk to.
priority=10

[program:bridge]
command=voice-to-anylist run
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[eventlistener:quit_on_fatal]
; Supervisor keeps running after a program gives up restarting, which would
; leave a container that looks alive but syncs nothing. Exit instead so the
; orchestrator restarts the whole thing.
command=sh -c 'printf "READY\n"; while read -r line; do echo "$line" >&2; kill -SIGQUIT $PPID; done'
events=PROCESS_STATE_FATAL
