# Deploy: fly launch --no-deploy && fly volumes create state --size 1
# then set secrets (see docs/SETUP.md) and `fly deploy`.
app = "voice-to-anylist"
primary_region = "syd"

[build]

[env]
  HTTP_PORT = "8080"
  STATE_PATH = "/data/state.sqlite"
  KEEP_STATE_PATH = "/data/keep_state.json"
  ANYLIST_CREDENTIALS_FILE = "/data/.anylist_credentials"
  POLL_INTERVAL_SECONDS = "20"

[mounts]
  source = "state"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The bridge polls Google; it must keep running when nobody is looking at it.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
